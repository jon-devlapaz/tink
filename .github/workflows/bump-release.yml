name: bump-release

# Every push to main ships a patch release after the quality and native-platform
# gates: bump Cargo version, atomically publish main plus its tag, then dispatch
# the tag/ref-based release workflow.
# GITHUB_TOKEN pushes do not re-trigger workflows; we still skip our own
# release commits and dispatch release.yml explicitly.

on:
  push:
    branches: [main]

concurrency:
  group: bump-release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: "${{ !startsWith(github.event.head_commit.message, 'chore: release v') }}"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Verify
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          cargo test --workspace --locked --doc
          cargo build --workspace --release --locked
          sh -n install.sh
          shellcheck -x install.sh

  audit:
    if: "${{ !startsWith(github.event.head_commit.message, 'chore: release v') }}"
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Dependency audit
        uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # Node 24
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  platform:
    if: "${{ !startsWith(github.event.head_commit.message, 'chore: release v') }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}

      - name: Test
        run: cargo test --workspace --all-targets --locked --target ${{ matrix.target }}

      - name: Build release
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}

  bump:
    needs: [verify, audit, platform]
    if: "${{ !startsWith(github.event.head_commit.message, 'chore: release v') }}"
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Bump patch, tag, and dispatch release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --tags

          current="$(sed -n 's/^version = "\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)"/\1/p' Cargo.toml | head -n1)"
          if [ -z "${current}" ]; then
            echo "Could not read package version from Cargo.toml" >&2
            exit 1
          fi

          locked="$(python3 - <<'PY'
          import tomllib
          with open("Cargo.lock", "rb") as source:
              packages = tomllib.load(source)["package"]
          matches = [package["version"] for package in packages if package["name"] == "tink"]
          if len(matches) != 1:
              raise SystemExit("Cargo.lock must contain exactly one tink package")
          print(matches[0])
          PY
          )"
          if [ "${locked}" != "${current}" ]; then
            echo "Cargo.lock tink version ${locked} does not match Cargo.toml ${current}" >&2
            exit 1
          fi

          current_tag="v${current}"
          if git rev-parse --verify --quiet "refs/tags/${current_tag}" >/dev/null; then
            current_tagged_version="$(git show "${current_tag}:Cargo.toml" | sed -n 's/^version = "\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)"/\1/p' | head -n1)"
            if [ "${current_tagged_version}" != "${current}" ]; then
              echo "Existing tag ${current_tag} does not contain Cargo version ${current}" >&2
              exit 1
            fi
            current_tag_commit="$(git rev-parse "${current_tag}^{commit}")"
            if ! git merge-base --is-ancestor "${current_tag_commit}" origin/main; then
              echo "Existing tag ${current_tag} is not contained in origin/main" >&2
              exit 1
            fi
            current_release_draft="$(gh release view "${current_tag}" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
            if [ "${current_release_draft}" != "false" ]; then
              gh workflow run release.yml --ref "${current_tag}"
              echo "Re-dispatched incomplete release ${current_tag}; rerun this bump after it publishes." >&2
              exit 1
            fi
          fi

          # An intentionally pre-bumped, untagged manifest (for example 1.0.0)
          # publishes that exact version instead of incrementing it again.
          if ! git rev-parse --verify --quiet "refs/tags/${current_tag}" >/dev/null; then
            baseline_tag="$(gh release view --json tagName --jq '.tagName' 2>/dev/null || true)"
            if [ -z "${baseline_tag}" ]; then
              echo "Cannot publish ${current_tag} without a published release baseline" >&2
              exit 1
            fi
            baseline_version="${baseline_tag#v}"
            if ! python3 - "${current}" "${baseline_version}" <<'PY'
          import re
          import sys

          current, baseline = sys.argv[1:]
          pattern = re.compile(r"(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)")
          if pattern.fullmatch(current) is None or pattern.fullmatch(baseline) is None:
              raise SystemExit(1)
          raise SystemExit(0 if tuple(map(int, current.split("."))) > tuple(map(int, baseline.split("."))) else 1)
          PY
            then
              echo "Pre-bumped version ${current} must be newer than published ${baseline_tag}" >&2
              exit 1
            fi
            if ! git rev-parse --verify --quiet "refs/tags/${baseline_tag}" >/dev/null; then
              echo "Published baseline tag ${baseline_tag} is missing locally" >&2
              exit 1
            fi
            baseline_tagged_version="$(git show "${baseline_tag}:Cargo.toml" | sed -n 's/^version = "\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)"/\1/p' | head -n1)"
            if [ "${baseline_tagged_version}" != "${baseline_version}" ]; then
              echo "Baseline tag ${baseline_tag} does not contain Cargo version ${baseline_version}" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "${baseline_tag}^{commit}" origin/main; then
              echo "Baseline tag ${baseline_tag} is not contained in origin/main" >&2
              exit 1
            fi
            baseline_release_draft="$(gh release view "${baseline_tag}" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
            if [ "${baseline_release_draft}" != "false" ]; then
              echo "Baseline release ${baseline_tag} is not published" >&2
              exit 1
            fi
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              echo "origin/main advanced after this workflow started; a newer run owns the release" >&2
              exit 1
            fi

            git tag "${current_tag}"
            git push --atomic origin HEAD:main "refs/tags/${current_tag}:refs/tags/${current_tag}"
            gh workflow run release.yml --ref "${current_tag}"
            echo "Dispatched intentional release for ${current_tag}"
            exit 0
          fi

          IFS=. read -r major minor patch <<< "${current}"
          new="${major}.${minor}.$((patch + 1))"
          tag="v${new}"

          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            tagged_version="$(git show "${tag}:Cargo.toml" | sed -n 's/^version = "\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)"/\1/p' | head -n1)"
            if [ "${tagged_version}" != "${new}" ]; then
              echo "Existing tag ${tag} does not contain Cargo version ${new}" >&2
              exit 1
            fi
            tag_commit="$(git rev-parse "${tag}^{commit}")"
            if ! git merge-base --is-ancestor "${tag_commit}" origin/main; then
              echo "Existing tag ${tag} is not contained in origin/main" >&2
              exit 1
            fi
            release_draft="$(gh release view "${tag}" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
            if [ "${release_draft}" = "false" ]; then
              echo "Release ${tag} is already published."
              exit 0
            fi
            gh workflow run release.yml --ref "${tag}"
            echo "Re-dispatched incomplete release ${tag}."
            exit 0
          fi

          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "origin/main advanced after this workflow started; a newer run owns the next bump" >&2
            exit 1
          fi

          sed -i "s/^version = \"${current}\"/version = \"${new}\"/" Cargo.toml
          CURRENT="${current}" NEW="${new}" python3 - <<'PY'
          import os
          from pathlib import Path

          current = os.environ["CURRENT"]
          new = os.environ["NEW"]
          path = Path("Cargo.lock")
          text = path.read_text()
          needle = f'name = "tink"\nversion = "{current}"'
          repl = f'name = "tink"\nversion = "{new}"'
          if needle not in text:
              raise SystemExit(f"Cargo.lock missing package entry for tink {current}")
          path.write_text(text.replace(needle, repl, 1))
          PY

          git add Cargo.toml Cargo.lock
          git commit -m "chore: release v${new}"
          git tag "${tag}"
          git push --atomic origin HEAD:main "refs/tags/${tag}:refs/tags/${tag}"

          # Token pushes do not cascade to on.push.tags; dispatch explicitly.
          gh workflow run release.yml --ref "${tag}"
          echo "Dispatched release for ${tag} (was ${current})"
