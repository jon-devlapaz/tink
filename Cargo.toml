[package]
name = "tink"
version = "0.1.0"
edition = "2024"
description = "Install Agent Skills into a project's .agents/skills/"
license = "MIT"
repository = "https://github.com/jon-devlapaz/tink"
readme = "README.md"
keywords = ["agents", "skills", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.6.5", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
