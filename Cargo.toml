[package]
name = "tink"
version = "1.0.1"
edition = "2024"
rust-version = "1.95"
description = "Install Agent Skills into a project's .agents/skills/"
license = "MIT"
repository = "https://github.com/jon-devlapaz/tink"
readme = "README.md"
keywords = ["agents", "skills", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anstyle = "1.0.14"
clap = { version = "4.6.5", features = ["derive", "color"] }
clap_complete = { version = "4.6.8", features = ["unstable-dynamic"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
signal-hook = "0.3.18"
toml = "0.8"
tempfile = "3.27.0"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
